# Example: dummypage behind Traefik (automatic HTTPS via Let's Encrypt).
# Build the app image from the repo root:  docker build -t dummypage .
# Then from this folder:                    docker compose -f docker-compose.traefik.yml up -d
#
# Replace example.com and the ACME e-mail below.

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=you@example.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_le:/letsencrypt
    restart: unless-stopped

  app:
    image: dummypage
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      TRUST_PROXY: "true"        # Traefik sets X-Forwarded-For / X-Real-IP by default
      LIVE: "true"               # serve the full site (drop to show "under development")
      GOMEMLIMIT: 16MiB
    labels:
      - traefik.enable=true
      - traefik.http.routers.dummypage.rule=Host(`example.com`)
      - traefik.http.routers.dummypage.entrypoints=websecure
      - traefik.http.routers.dummypage.tls.certresolver=le
      - traefik.http.services.dummypage.loadbalancer.server.port=8080
    restart: unless-stopped

volumes:
  traefik_le:
