# Example Apache (httpd) reverse-proxy config for dummypage.
# Requires: a2enmod proxy proxy_http headers
# Run the app bound to localhost:  LISTEN_HOST=127.0.0.1 TRUST_PROXY=true ./dummypage --live

<VirtualHost *:80>
    ServerName example.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Apache adds X-Forwarded-For itself; set the rest explicitly.
    RequestHeader set X-Real-IP        "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>

