# Example nginx reverse-proxy config for dummypage.
# Run the app bound to localhost:  LISTEN_HOST=127.0.0.1 TRUST_PROXY=true ./dummypage --live
#
# Put this in /etc/nginx/sites-available/ (or conf.d/) and adjust server_name / TLS.

server {
    listen 80;
    server_name example.com;

    # redirect to HTTPS (uncomment once TLS is configured below)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
    }
}

