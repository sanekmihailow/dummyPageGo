# Example: dummypage behind Caddy (automatic HTTPS).
# Build the app image from the repo root:  docker build -t dummypage .
# Then from this folder:                    docker compose -f docker-compose.caddy.yml up -d
#
# Put your domain in deployments/Caddyfile first, and in compose use the service name
# as the upstream:  reverse_proxy app:8080   (not 127.0.0.1:8080).

services:
  app:
    image: dummypage
    environment:
      LISTEN_HOST: 0.0.0.0        # reachable from the proxy container
      LISTEN_PORT: "8080"
      TRUST_PROXY: "true"         # take client IP from the proxy headers
      LIVE: "true"                # serve the full site (drop to show "under development")
      GOMEMLIMIT: 16MiB
    restart: unless-stopped
    # no ports published: only Caddy is exposed to the outside

  caddy:
    image: caddy:2-alpine
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
